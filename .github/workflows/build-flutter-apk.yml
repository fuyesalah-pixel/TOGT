name: Build Flutter APK

on:
  push:
    branches: [ main ]
    paths:
      - 'togt-mobile-flutter/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:
    inputs:
      update_base:
        description: 'Test-only override for the in-app update base URL (e.g. http://127.0.0.1:8080). Empty = production.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: togt-mobile-flutter
        run: flutter pub get

      - name: Analyze
        working-directory: togt-mobile-flutter
        # --no-fatal-warnings/--no-fatal-infos: repo carries pre-existing
        # lint findings (withOpacity deprecations etc.) on the stable channel;
        # analyze still fails on genuine errors.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        working-directory: togt-mobile-flutter
        run: flutter test

      - name: Inject build credentials (Firebase + release keystore)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        # Writes credential files into the (gitignored) android/ tree that the
        # Google Services Gradle plugin and the release signingConfig expect.
        # All three secrets are stored base64-encoded to survive echo/quoting.
        working-directory: togt-mobile-flutter/android
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > app/togt-release.jks
          echo "$ANDROID_KEYSTORE_PROPERTIES" | base64 -d > key.properties
          ls -la app/google-services.json app/togt-release.jks key.properties

      - name: Build release APK
        working-directory: togt-mobile-flutter
        env:
          UPDATE_BASE: ${{ inputs.update_base }}
        run: |
          ARGS=""
          if [ -n "$UPDATE_BASE" ]; then ARGS="--dart-define=TOGT_UPDATE_BASE=$UPDATE_BASE"; fi
          flutter build apk --release --dart-define=TOGT_LOCAL_API=false $ARGS

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOGT-Android-APK
          path: togt-mobile-flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK to website downloads
        if: github.event_name == 'push' || inputs.update_base == ''
        run: |
          PUBSPEC_VERSION=$(grep '^version:' togt-mobile-flutter/pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          VERSION_NAME=${PUBSPEC_VERSION%%+*}
          VERSION_CODE=${PUBSPEC_VERSION##*+}
          mkdir -p togt-web/public/downloads
          cp togt-mobile-flutter/build/app/outputs/flutter-apk/app-release.apk togt-web/public/downloads/TOGT-Android.apk
          cat > togt-web/public/downloads/version.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://travel.togttrading.com/downloads/TOGT-Android.apk",
            "forceUpdate": false
          }
          EOF
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add togt-web/public/downloads/TOGT-Android.apk togt-web/public/downloads/version.json
          git diff --cached --quiet || git commit -m "build: update Android APK and version manifest"
          git push