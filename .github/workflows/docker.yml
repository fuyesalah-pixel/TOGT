name: Build togt-web image

on:
  push:
    branches: [main]
    paths:
      - "togt-web/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: docker buildx build -t ghcr.io/${{ github.repository_owner }}/togt-web:main -f togt-web/Dockerfile ./togt-web --load

      - name: Push
        run: docker push ghcr.io/${{ github.repository_owner }}/togt-web:main
