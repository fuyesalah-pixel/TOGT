version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: togt-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-togt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-togt_db}
    volumes:
      - togt_postgres_data:/var/lib/postgresql/data
    networks: [togt-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-togt} -d ${POSTGRES_DB:-togt_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:7-alpine
    container_name: togt-valkey-prod
    restart: unless-stopped
    volumes:
      - togt_valkey_data:/data
    networks: [togt-network]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  promote-fuad:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-change_me}
    command:
      - sh
      - -c
      - psql -h postgres -U ${POSTGRES_USER:-togt} -d ${POSTGRES_DB:-togt_db} -v ON_ERROR_STOP=1 -c "UPDATE \"User\" SET \"role\" = 'ADMIN' WHERE LOWER(\"email\") = 'fuadnesredinhiyar@gmail.com';"
    networks: [togt-network]

  togt-api:
    # Force Hostinger to rebuild the API instead of reusing the stale auth image.
    build:
      context: https://github.com/fuyesalah-pixel/TOGT.git#main:togt-api
      args:
        CACHE_BUST: "20260829093000"
    container_name: togt-api-prod
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    environment:
      PORT: 3001
      FRONTEND_URL: https://travel.togttrading.com
      BACKEND_URL: https://travel.togttrading.com
      DATABASE_URL: postgresql://${POSTGRES_USER:-togt}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-togt_db}
      VALKEY_URL: redis://valkey:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: https://travel.togttrading.com/api/auth/google/callback
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY}
      CHAPA_ENCRYPTION_KEY: ${CHAPA_ENCRYPTION_KEY}
      CHAPA_WEBHOOK_SECRET: ${CHAPA_WEBHOOK_SECRET}
      CHAPA_API_URL: https://api.chapa.co/v1
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:-togt-storage}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-togt-storage}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-TOGT <noreply@togttrading.com>}
      SMS_ETHIOPIA_TOKEN: ${SMS_ETHIOPIA_TOKEN}
      COOKIE_SECURE: "true"
    networks: [togt-network]
    ports:
      - "127.0.0.1:3001:3001"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=togt-travel_togt-network"
      - "traefik.http.routers.togt-api.rule=Host(`travel.togttrading.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.togt-api.entrypoints=websecure"
      - "traefik.http.routers.togt-api.tls=true"
      - "traefik.http.routers.togt-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.togt-api.priority=100"
      - "traefik.http.routers.togt-socket.rule=Host(`travel.togttrading.com`) && PathPrefix(`/socket.io`)"
      - "traefik.http.routers.togt-socket.entrypoints=websecure"
      - "traefik.http.routers.togt-socket.tls=true"
      - "traefik.http.routers.togt-socket.tls.certresolver=letsencrypt"
      - "traefik.http.routers.togt-socket.priority=100"
      - "traefik.http.services.togt-api.loadbalancer.server.port=3001"

  togt-web:
    build:
      context: https://github.com/fuyesalah-pixel/TOGT.git#main:togt-web
      args:
        NEXT_PUBLIC_API_URL: https://travel.togttrading.com
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_CHAPA_PUBLIC_KEY: ${NEXT_PUBLIC_CHAPA_PUBLIC_KEY}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${MAPBOX_ACCESS_TOKEN}
        CACHE_BUST: "20260829111500"
    container_name: togt-web-prod
    restart: unless-stopped
    depends_on: [togt-api]
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks: [togt-network]
    ports:
      - "127.0.0.1:3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=togt-travel_togt-network"
      - "traefik.http.routers.togt-web.rule=Host(`travel.togttrading.com`) && PathPrefix(`/`)"
      - "traefik.http.routers.togt-web.entrypoints=websecure"
      - "traefik.http.routers.togt-web.tls=true"
      - "traefik.http.routers.togt-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.togt-web.priority=10"
      - "traefik.http.services.togt-web.loadbalancer.server.port=3000"

networks:
  togt-network:
    driver: bridge

volumes:
  togt_postgres_data:
  togt_valkey_data:
