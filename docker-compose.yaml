version: "3.9"

services:
  togt-web:
    build:
      context: ./togt-web
      dockerfile: Dockerfile
    container_name: togt-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APP_URL=https://travel.togttrading.com
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.togt-web.rule=Host(`travel.togttrading.com`)"
      - "traefik.http.routers.togt-web.entrypoints=websecure"
      - "traefik.http.routers.togt-web.tls=true"
      - "traefik.http.routers.togt-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.togt-web.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
