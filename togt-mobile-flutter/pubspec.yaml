name: togt_mobile_app
description: "TOGT Tour & Travel — native mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.4
  adhan: ^2.0.0+1
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  socket_io_client: ^3.1.6
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/togt_mobile_logo.jpg
    - assets/audio/azan.mp3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/togt_mobile_logo.jpg
  adaptive_icon_background: "#1F67B1"
  adaptive_icon_foreground: assets/logo/togt_mobile_logo.jpg
