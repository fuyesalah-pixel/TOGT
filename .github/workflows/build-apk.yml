name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: togt-web/package-lock.json

      - name: Install dependencies
        working-directory: togt-web
        run: npm ci

      # Capacitor is configured with server.url because Next middleware and
      # authenticated dashboard routes cannot be static-exported safely.
      - name: Sync Capacitor Android project
        working-directory: togt-web
        run: npx cap sync android

      - name: Build debug APK
        working-directory: togt-web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOGT-Android-APK
          path: togt-web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to website downloads
        run: |
          mkdir -p togt-web/public/downloads
          cp togt-web/android/app/build/outputs/apk/debug/app-debug.apk togt-web/public/downloads/TOGT-Android.apk
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add togt-web/public/downloads/TOGT-Android.apk
          git diff --cached --quiet || git commit -m "build: add Android APK"
          git push
