name: Build togt-api image

on:
  push:
    branches: [main]
    paths:
      - "togt-api/**"
      - ".github/workflows/docker-api.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./togt-api
          file: ./togt-api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/togt-api:main
